name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: gh-img-resize.exe
            artifact_path: dist/gh-img-resize.exe
          - os: macos-latest
            artifact_name: gh-img-resize.app.zip
            artifact_path: dist/gh-img-resize.app.zip
          - os: ubuntu-latest
            artifact_name: gh-img-resize
            artifact_path: dist/gh-img-resize
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Tk on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tcl-dev tk-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python -m PyInstaller --noconfirm --clean gh-img-resize.spec

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/gh-img-resize.app dist/gh-img-resize.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
