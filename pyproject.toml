[project]
name = "gh-img-resize"
version = "1.1.1"
description = "Desktop tool that resizes images to exactly 999 KB for GitHub uploads"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/gh_img_resize/i18n.py" = ["E501"]
